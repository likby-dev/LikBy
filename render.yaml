# LikBy Render Blueprint Specification
# Infrastructure as Code for deploying on Render
# Docs: https://render.com/docs/blueprint-spec

services:
  # ============================================================================
  # LikBy Primary Webhook & API Service (FastAPI + Aiogram 3)
  # ============================================================================
  - type: web
    name: likby-app
    runtime: python
    region: oregon
    plan: free # Upgrade to 'starter' ($7/mo) for 24/7 persistent uptime without sleep
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn likby.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: BOT_MODE
        value: webhook
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: BOT_TOKEN
        sync: false # Set securely in Render dashboard (e.g. 123456789:ABCdef...)
      - key: WEBHOOK_SECRET_TOKEN
        generateValue: true # Render generates a secure random 32-char secret token
      - key: BASE_URL
        fromService:
          type: web
          name: likby-app
          property: host # Render sets this to your-service.onrender.com
      - key: DATABASE_BACKEND
        value: sqlite
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///likby.db # For persistent disk, use sqlite+aiosqlite:////data/likby.db
      - key: STORAGE_PROVIDER
        value: local
      - key: MEDIA_STORE_DIR
        value: media_store

    # --------------------------------------------------------------------------
    # Optional: Persistent Disk (Requires Render Starter plan or above)
    # Uncomment below to preserve SQLite database and media assets across deploys:
    # --------------------------------------------------------------------------
    # disk:
    #   name: likby-data
    #   mountPath: /data
    #   sizeGB: 1

  # ============================================================================
  # Alternative: LikBy Background Worker (Long Polling Mode)
  # Uncomment this service if you prefer running continuous polling instead of webhooks.
  # ============================================================================
  # - type: worker
  #   name: likby-worker
  #   runtime: python
  #   region: oregon
  #   plan: free
